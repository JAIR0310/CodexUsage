name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift tests
        run: swift test
      - name: Release consistency
        run: python3 Tools/check_release_consistency.py
      - name: Layout validation
        run: python3 Tools/validate_layout.py --tokens Design/VisualTokens.json
      - name: Glass material validation
        run: python3 Tools/validate_glass_material.py
      - name: Edge optics validation
        run: python3 Tools/validate_edge_optics.py
      - name: Build app (Apple Silicon)
        run: CODEX_USAGE_ARCH=arm64 ./build_macos.command
      - name: Build app (Intel)
        run: CODEX_USAGE_ARCH=x86_64 ./build_macos.command
