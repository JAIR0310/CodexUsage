function applyCard(el,t){const side=el.classList.contains('warm')?'left':'right'; const cb=(C[side+'_card_brightness_scale']||1); el.style.setProperty('--accent',t.accentRgb);el.style.setProperty('--border',t.borderRgb);el.style.setProperty('--border-w',px(t.borderWidth));el.style.setProperty('--border-spec',t.borderSpecularOpacity);el.style.setProperty('--border-glow-opacity',t.borderGlowOpacity);el.style.setProperty('--border-glow-blur',px(t.borderGlowBlur));
 const warmEdge=`radial-gradient(70% 58% at 0% 5%,rgba(255,255,255,.96),rgba(255,225,184,.56) 30%,transparent 72%),radial-gradient(64% 54% at 0% 100%,rgba(255,194,102,.92),rgba(255,220,170,.36) 34%,transparent 70%),radial-gradient(58% 50% at 100% 100%,rgba(255,244,224,.86),rgba(255,195,108,.32) 34%,transparent 70%),linear-gradient(135deg,rgba(255,255,255,.48),rgba(255,255,255,.26))`;
 const coolEdge=`radial-gradient(66% 56% at 100% 4%,rgba(247,252,255,.98),rgba(126,204,255,.72) 34%,transparent 70%),radial-gradient(68% 58% at 100% 100%,rgba(183,231,255,.94),rgba(92,184,255,.58) 34%,transparent 70%),radial-gradient(52% 46% at 0% 0%,rgba(255,255,255,.66),transparent 72%),linear-gradient(135deg,rgba(255,255,255,.46),rgba(220,241,255,.24))`;
 const warmBloom=`radial-gradient(66% 54% at 0% 7%,rgba(255,211,151,.78),transparent 66%),radial-gradient(66% 56% at 0% 100%,rgba(255,181,82,.88),transparent 64%),radial-gradient(58% 50% at 100% 100%,rgba(255,226,181,.72),transparent 66%)`;
 const coolBloom=`radial-gradient(64% 52% at 100% 7%,rgba(140,211,255,.84),transparent 64%),radial-gradient(66% 56% at 100% 100%,rgba(88,186,255,.90),transparent 64%)`;
 el.style.setProperty('--edge-map',side==='left'?warmEdge:coolEdge); el.style.setProperty('--edge-bloom-map',side==='left'?warmBloom:coolBloom); el.style.filter=`brightness(${cb})`;el.style.left=(ox+t.x*s)+'px';el.style.top=(oy+t.y*s)+'px';el.style.width=px(t.w);el.style.height=px(t.h);el.style.borderRadius=px(t.radius);el.style.background=`radial-gradient(90% 78% at 12% 12%,rgba(255,255,255,${t.topSheen}),transparent 48%),radial-gradient(75% 80% at 88% 88%,rgba(${t.accentRgb},${t.accentInner}),transparent 57%),linear-gradient(145deg,rgba(232,238,244,${t.glassMaterialOpacity*.20}),rgba(196,207,219,${t.glassMaterialOpacity*.08})),linear-gradient(145deg,${t.c1},${t.c2} 57%,${t.c3}),rgba(0,0,0,${t.glassTintOpacity})`;el.style.backdropFilter=`blur(${px(t.backdropBlur)}) saturate(1.14)`;el.style.webkitBackdropFilter=el.style.backdropFilter;el.style.boxShadow=`0 ${px(t.shadowY)} ${px(t.shadowBlur)} rgba(0,0,0,${t.shadowOpacity}), 0 0 ${px(t.outerGlow)} rgba(${t.accentRgb},${t.outerGlowOpacity}), inset 0 0 ${px(t.innerBlur)} rgba(255,255,255,${t.innerWhite}), inset 0 0 0 ${px(.7)} rgba(255,255,255,${t.innerRimOpacity})`;

function decodeInt16LE(b64){
  const raw=atob(b64); const out=new Int16Array(raw.length/2);
  for(let i=0,j=0;i<raw.length;i+=2,j++){
    let v=raw.charCodeAt(i)|(raw.charCodeAt(i+1)<<8); if(v&0x8000)v-=0x10000; out[j]=v;
  }
  return out;
}
function reconstructChannel(spec,w,h,rank){
  const Lq=decodeInt16LE(spec.leftB64),Rq=decodeInt16LE(spec.rightB64);
  const Ls=spec.leftScale,Rs=spec.rightScale; const out=new Float32Array(w*h);
  for(let y=0;y<h;y++){
    const ly=y*rank;
    for(let x=0;x<w;x++){
      let v=0;
      for(let k=0;k<rank;k++)v+=(Lq[ly+k]*Ls)*(Rq[k*w+x]*Rs);
      out[y*w+x]=Math.max(0,Math.min(1,v));
    }
  }
  return out;
}
function renderR19OpticalField(){
  const field=TOKENS.r19OpticalField; if(!field)return;
  const mc=document.querySelector('.r19-optics-field.multiply');
  const sc=document.querySelector('.r19-optics-field.screen');
  const W=TOKENS.canvas.width,H=TOKENS.canvas.height;
  for(const c of [mc,sc]){c.width=W;c.height=H;c.style.width=W+'px';c.style.height=H+'px';}
  mc.style.mixBlendMode='multiply';sc.style.mixBlendMode='screen';
  const mctx=mc.getContext('2d',{willReadFrequently:false}),sctx=sc.getContext('2d',{willReadFrequently:false});
  mctx.fillStyle='rgb(255,255,255)';mctx.fillRect(0,0,W,H);
  sctx.fillStyle='rgb(0,0,0)';sctx.fillRect(0,0,W,H);
  for(const f of Object.values(field.fields)){
    const rank=f.rank,w=f.w,h=f.h;
    const ma=f.channels.multiplyAttenuation.map(ch=>reconstructChannel(ch,w,h,rank));
    const ss=f.channels.screen.map(ch=>reconstructChannel(ch,w,h,rank));
    const mi=mctx.createImageData(w,h),si=sctx.createImageData(w,h);
    function smoothstep01(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}
    function roundedRectSD(gx,gy,q){
      const cx=(q.x1+q.x2)/2,cy=(q.y1+q.y2)/2,hx=(q.x2-q.x1)/2,hy=(q.y2-q.y1)/2;
      const qx=Math.abs(gx-cx)-(hx-q.radius),qy=Math.abs(gy-cy)-(hy-q.radius);
      return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-q.radius;
    }
    function focusSupport(gx,gy,rect,sigma){
      const dx=Math.max(rect[0]-gx,0,gx-(rect[2]-1));
      const dy=Math.max(rect[1]-gy,0,gy-(rect[3]-1));
      const d=Math.hypot(dx,dy);return Math.exp(-0.5*(d/sigma)*(d/sigma));
    }
    function opticalSupport(fieldName,gx,gy){
      const sp=field.support||{};
      if(fieldName==='ring'){
        const q=sp.ring||{cx:98,cy:92,radius:62,feather:8};
        const d=Math.hypot(gx-q.cx,gy-q.cy);
        if(q.outerStrength!==undefined){
          const inner=q.innerRadius??28, trans=q.transition??3, outer=q.outerRadius??48, feather=q.feather??7;
          if(d<=inner)return 1;
          if(d<inner+trans){const t=smoothstep01((d-inner)/trans);return 1+(q.outerStrength-1)*t;}
          if(d<=outer)return q.outerStrength;
          return q.outerStrength*(1-smoothstep01((d-outer)/feather));
        }
        return (q.strength??1)*smoothstep01((q.radius+q.feather-d)/q.feather);
      }
      const q=sp[fieldName]; if(!q || q.type==='full')return 1;
      const sd=roundedRectSD(gx,gy,q);
      let a=Math.exp(-0.5*(sd/sp.cardBandSigma)*(sd/sp.cardBandSigma));
      if(fieldName==='left' && q.ringNotchInner!==undefined){
        const rq=sp.ring||{cx:98,cy:92};const d=Math.hypot(gx-rq.cx,gy-rq.cy);
        a*=smoothstep01((d-q.ringNotchInner)/q.ringNotchWidth);
      }
      return Math.max(a,focusSupport(gx,gy,q.focus,q.focusSigma));
    }
    const fieldName=Object.entries(field.fields).find(([,value])=>value===f)?.[0]||'';
    for(let i=0;i<w*h;i++){
      const p=i*4, lx=i%w, ly=Math.floor(i/w), a=opticalSupport(fieldName,f.x+lx,f.y+ly);
      mi.data[p]=Math.round(255*((1-a)+a*(1-ma[0][i])));mi.data[p+1]=Math.round(255*((1-a)+a*(1-ma[1][i])));mi.data[p+2]=Math.round(255*((1-a)+a*(1-ma[2][i])));mi.data[p+3]=255;
      si.data[p]=Math.round(255*(a*ss[0][i]));si.data[p+1]=Math.round(255*(a*ss[1][i]));si.data[p+2]=Math.round(255*(a*ss[2][i]));si.data[p+3]=255;
    }
    mctx.putImageData(mi,f.x,f.y);sctx.putImageData(si,f.x,f.y);
  }
}
